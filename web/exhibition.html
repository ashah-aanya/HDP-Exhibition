<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            cursor: none;
        }
        
        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        let scene, camera, renderer, points;
        let data = null;
        let frameIndex = 0;
        let targetPositions = [];
        let currentPositions = [];
        let velocities = [];
        
        async function init() {
            const response = await fetch('exhibition_data.json');
            data = await response.json();
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 8);
            
            const canvas = document.getElementById('canvas');
            renderer = new THREE.WebGLRenderer({ 
                canvas, 
                antialias: true,
                alpha: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            createPoints();
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);
            
            window.addEventListener('resize', onResize);
            
            animate();
        }
        
        function createPoints() {
            const geometry = new THREE.BufferGeometry();
            
            const colors = [];
            data.words.forEach(item => {
                const color = new THREE.Color(item.color);
                colors.push(color.r, color.g, color.b);
            });
            
            // Initialize positions and velocities
            const numPoints = data.words.length;
            for (let i = 0; i < numPoints; i++) {
                currentPositions.push([0, 0, 0]);
                targetPositions.push([0, 0, 0]);
                velocities.push([0, 0, 0]);
            }
            
            // Set initial positions
            data.frames[0].forEach((pos, i) => {
                currentPositions[i] = [...pos];
                targetPositions[i] = [...pos];
            });
            
            const positions = new Float32Array(numPoints * 3);
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                sizeAttenuation: true,
                blending: THREE.AdditiveBlending
            });
            
            points = new THREE.Points(geometry, material);
            scene.add(points);
        }
        
        function updatePositions() {
            if (!data || !points) return;
            
            const numFrames = data.frames.length;
            const positions = points.geometry.attributes.position.array;
            
            // Smoothly advance to next frame
            frameIndex += 0.005; // Very slow progression
            
            const currentFrame = Math.floor(frameIndex) % numFrames;
            const nextFrame = (currentFrame + 1) % numFrames;
            
            // Update target positions with smooth interpolation
            const t = frameIndex % 1;
            const smoothT = t * t * (3 - 2 * t); // Smooth step interpolation
            
            for (let i = 0; i < data.words.length; i++) {
                const curr = data.frames[currentFrame][i];
                const next = data.frames[nextFrame][i];
                
                // Calculate new target with smooth interpolation
                for (let j = 0; j < 3; j++) {
                    targetPositions[i][j] = curr[j] + (next[j] - curr[j]) * smoothT;
                }
                
                // Apply spring physics for ultra-smooth movement
                const stiffness = 0.05;
                const damping = 0.85;
                
                for (let j = 0; j < 3; j++) {
                    const force = (targetPositions[i][j] - currentPositions[i][j]) * stiffness;
                    velocities[i][j] = (velocities[i][j] + force) * damping;
                    currentPositions[i][j] += velocities[i][j];
                    
                    positions[i * 3 + j] = currentPositions[i][j];
                }
            }
            
            points.geometry.attributes.position.needsUpdate = true;
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            updatePositions();
            
            // Slow camera orbit
            const time = Date.now() * 0.00005;
            camera.position.x = Math.sin(time) * 8;
            camera.position.z = Math.cos(time) * 8;
            camera.position.y = Math.sin(time * 0.5) * 3;
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }
        
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        init();
    </script>
</body>
</html>
