<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Words - Exhibition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: "Consolas", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: rgba(0, 20, 40, 0.7);
            border: none;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: normal;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            outline: none;
            transition: all 0.3s;
            font-family: "Consolas", monospace;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 2px rgba(255, 152, 0, 0.4);
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 14px;
            font-weight: normal;
            border: none;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            font-family: "Consolas", monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
        }

        button:active:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s ease;
            border: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            color: #81c784;
            display: block;
        }

        .status.error {
            background: rgba(244, 67, 54, 0.2);
            color: #e57373;
            display: block;
        }

        .status.info {
            background: rgba(255, 152, 0, 0.2);
            color: #ffb74d;
            display: block;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 6px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f44336;
            flex-shrink: 0;
        }

        .status-dot.connected {
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Add Word</h1>
        <p class="subtitle">Enter a word to add to the visualization</p>

        <div class="connection-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="connectionText">Connecting...</span>
        </div>

        <div class="input-group">
            <label for="wordInput">Word</label>
            <input
                type="text"
                id="wordInput"
                placeholder="Type a word and press Enter"
                autocomplete="off"
            >
        </div>

        <button id="addButton" disabled>Add Word</button>

        <div class="status" id="statusMessage"></div>
    </div>

    <script>
        let ws = null;

        const wordInput = document.getElementById('wordInput');
        const addButton = document.getElementById('addButton');
        const statusMessage = document.getElementById('statusMessage');
        const statusDot = document.getElementById('statusDot');
        const connectionText = document.getElementById('connectionText');

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:8080/ws');

            ws.onopen = () => {
                console.log('Connected to server');
                statusDot.classList.add('connected');
                connectionText.textContent = 'Connected';
                addButton.disabled = false;
                wordInput.disabled = false;
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('Received:', data);

                if (data.type === 'response') {
                    if (data.success) {
                        showStatus('Word added! Try another word.', 'success');
                    } else {
                        showStatus('Word already exists. Try a different word.', 'error');
                    }
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                showStatus('Connection error', 'error');
            };

            ws.onclose = () => {
                console.log('Disconnected from server');
                statusDot.classList.remove('connected');
                connectionText.textContent = 'Disconnected - Reconnecting...';
                addButton.disabled = true;
                wordInput.disabled = true;

                // Attempt to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
        }

        function addWord() {
            const word = wordInput.value.trim();

            if (!word) {
                showStatus('Please enter a word', 'error');
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showStatus('Not connected to server', 'error');
                return;
            }

            // Show loading status immediately
            showStatus('Adding word...', 'info');

            // Send to server
            ws.send(JSON.stringify({
                command: 'add_word_with_position',
                word: word,
                position: [0, 0, 0] // Server will compute actual position
            }));

            // Clear input
            wordInput.value = '';
            wordInput.focus();
        }

        let statusTimeout = null;

        function showStatus(message, type) {
            // Clear any existing timeout
            if (statusTimeout) {
                clearTimeout(statusTimeout);
            }

            statusMessage.textContent = message;
            statusMessage.className = `status ${type}`;
            statusMessage.style.display = 'block';

            // Auto-hide after 3 seconds
            statusTimeout = setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 3000);
        }

        // Event listeners
        addButton.addEventListener('click', addWord);

        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addWord();
            }
        });

        // Connect on load
        connectWebSocket();

        // Focus input on load
        wordInput.focus();
    </script>
</body>
</html>
