<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Space Evolution</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    #canvas { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- KEEP ONLINE CDN FOR NOW -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    let scene, camera, renderer, points;
    let ws = null;
    let words = [];
    let currentPositions = [];
    let targetPositions = [];
    let velocities = [];

    // labels (nearest neighbors)
    let labelSprites = [];
    let labelTimeout = null;

    // Dynamic viewpoint state
    let cameraState = {
      focusIndex: 0,
      nextFocusIndex: 0,
      focusPosition: [0, 0, 0],
      cameraDistance: 15,
      targetDistance: 15,
      lastFocusTime: 0,
      focusTransitionDuration: 10000
    };

    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 8);

      const canvas = document.getElementById('canvas');
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0xffffff, 1);
      pointLight.position.set(5, 5, 5);
      scene.add(pointLight);

      addAxes();
      window.addEventListener('resize', onResize);

      animate();
    }

    function addAxes() {
      const axisLength = 2;
      const axisRadius = 0.02;

      const material = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.75
      });

      const xGeometry = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength * 2, 8);
      const xAxis = new THREE.Mesh(xGeometry, material);
      xAxis.rotation.z = Math.PI / 2;
      scene.add(xAxis);

      const yGeometry = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength * 2, 8);
      const yAxis = new THREE.Mesh(yGeometry, material);
      scene.add(yAxis);

      const zGeometry = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength * 2, 8);
      const zAxis = new THREE.Mesh(zGeometry, material);
      zAxis.rotation.x = Math.PI / 2;
      scene.add(zAxis);
    }

    function clearLabels() {
      labelSprites.forEach(s => {
        scene.remove(s);
        if (s.material && s.material.map) s.material.map.dispose();
        if (s.material) s.material.dispose();
      });
      labelSprites = [];
    }

    function makeTextSprite(text, color = "#ffffff") {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const fontSize = 36;
      ctx.font = `${fontSize}px Arial`;
      const padding = 16;
      const textWidth = Math.ceil(ctx.measureText(text).width);

      canvas.width = textWidth + padding * 2;
      canvas.height = fontSize + padding * 2;

      const ctx2 = canvas.getContext("2d");
      ctx2.font = `${fontSize}px Arial`;
      ctx2.fillStyle = "rgba(0,0,0,0.55)";
      ctx2.fillRect(0, 0, canvas.width, canvas.height);
      ctx2.fillStyle = color;
      ctx2.fillText(text, padding, fontSize + Math.floor(padding * 0.6));

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;

      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(1.2, 0.6, 1);
      return sprite;
    }

    function showNeighborLabels(neighborsForNewWords) {
      clearLabels();

      neighborsForNewWords.forEach(entry => {
        const newIdx = entry.newWordIndex;
        const neighborIdxs = (entry.neighbors || []).slice(0, 8);

        // label new word (orange)
        if (currentPositions[newIdx]) {
          const w = words[newIdx]?.word || "";
          const sprite = makeTextSprite(w, "#ff9800");
          sprite.position.set(
            currentPositions[newIdx][0],
            currentPositions[newIdx][1] + 0.25,
            currentPositions[newIdx][2]
          );
          scene.add(sprite);
          labelSprites.push(sprite);
        }

        // label neighbors (white)
        neighborIdxs.forEach(i => {
          if (!currentPositions[i]) return;
          const w = words[i]?.word || "";
          const sprite = makeTextSprite(w, "#ffffff");
          sprite.position.set(
            currentPositions[i][0],
            currentPositions[i][1] + 0.25,
            currentPositions[i][2]
          );
          scene.add(sprite);
          labelSprites.push(sprite);
        });
      });

      if (labelTimeout) clearTimeout(labelTimeout);
      labelTimeout = setTimeout(() => clearLabels(), 6000);
    }

    function updatePoints() {
      if (points) {
        scene.remove(points);
        points.geometry.dispose();
        points.material.dispose();
      }
      if (words.length === 0) return;

      const geometry = new THREE.BufferGeometry();

      const colors = [];
      words.forEach(item => {
        const color = new THREE.Color(item.color);
        colors.push(color.r, color.g, color.b);
      });

      while (currentPositions.length < words.length) {
        currentPositions.push([0, 0, 0]);
        velocities.push([0, 0, 0]);
      }

      const positions = new Float32Array(words.length * 3);
      for (let i = 0; i < words.length; i++) {
        positions[i * 3] = currentPositions[i][0];
        positions[i * 3 + 1] = currentPositions[i][1];
        positions[i * 3 + 2] = currentPositions[i][2];
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      // Soft circular dot texture (makes overlaps glow = lighter blue depth cue)
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 64, 64);

      const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
      grad.addColorStop(0.0, 'rgba(255,255,255,1.0)');
      grad.addColorStop(0.4, 'rgba(255,255,255,0.8)');
      grad.addColorStop(1.0, 'rgba(255,255,255,0.0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(32, 32, 30, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);

      const material = new THREE.PointsMaterial({
        size: 0.11,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        sizeAttenuation: true,
        map: texture,
        alphaTest: 0.05,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      points = new THREE.Points(geometry, material);
      scene.add(points);
    }

    function updatePositions() {
      if (!points || words.length === 0) return;

      const positions = points.geometry.attributes.position.array;
      const lerpFactor = 0.12;

      for (let i = 0; i < words.length; i++) {
        // targetPositions is now evolving (server streams frames)
        for (let j = 0; j < 3; j++) {
          currentPositions[i][j] += (targetPositions[i][j] - currentPositions[i][j]) * lerpFactor;
          positions[i * 3 + j] = currentPositions[i][j];
        }
      }
      points.geometry.attributes.position.needsUpdate = true;
    }

    function calculateDensity(pointIndex, radius = 2.0) {
      if (currentPositions.length === 0) return 0;
      const point = currentPositions[pointIndex];
      let neighborCount = 0;

      for (let i = 0; i < currentPositions.length; i++) {
        if (i === pointIndex) continue;
        const n = currentPositions[i];
        const dx = n[0] - point[0];
        const dy = n[1] - point[1];
        const dz = n[2] - point[2];
        const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (distance < radius) neighborCount++;
      }
      return neighborCount;
    }

    function findAdjacentCluster(currentIndex, radius = 3.0) {
      const point = currentPositions[currentIndex];
      let bestIndex = currentIndex;
      let bestScore = -1;

      for (let i = 0; i < currentPositions.length; i++) {
        if (i === currentIndex) continue;
        const n = currentPositions[i];
        const dx = n[0] - point[0];
        const dy = n[1] - point[1];
        const dz = n[2] - point[2];
        const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

        if (distance < radius) {
          const density = calculateDensity(i);
          const score = density - (distance * 0.5);
          if (score > bestScore) {
            bestScore = score;
            bestIndex = i;
          }
        }
      }
      return bestIndex;
    }

    function updateDynamicCamera() {
      if (currentPositions.length === 0) return;

      const now = Date.now();
      if (now - cameraState.lastFocusTime > cameraState.focusTransitionDuration) {
        cameraState.focusIndex = cameraState.nextFocusIndex;
        cameraState.nextFocusIndex = findAdjacentCluster(cameraState.focusIndex);
        cameraState.lastFocusTime = now;
      }

      const currentFocusPoint = currentPositions[cameraState.focusIndex];
      const nextFocusPoint = currentPositions[cameraState.nextFocusIndex];

      const timeSinceFocus = now - cameraState.lastFocusTime;
      const transitionProgress = Math.min(timeSinceFocus / cameraState.focusTransitionDuration, 1.0);
      const easeProgress = 1 - Math.pow(1 - transitionProgress, 3);

      for (let i = 0; i < 3; i++) {
        cameraState.focusPosition[i] =
          currentFocusPoint[i] + (nextFocusPoint[i] - currentFocusPoint[i]) * easeProgress;
      }

      const density = calculateDensity(cameraState.focusIndex, 2.5);
      const maxDensity = currentPositions.length * 0.3;

      cameraState.targetDistance = 20 - (Math.min(density, maxDensity) / maxDensity) * 14;
      cameraState.cameraDistance += (cameraState.targetDistance - cameraState.cameraDistance) * 0.02;

      const orbitRadius = cameraState.cameraDistance;
      const time = now / 1000;
      const angle = (time * 0.02) % (Math.PI * 2);

      camera.position.x = cameraState.focusPosition[0] + Math.cos(angle) * orbitRadius * 0.3;
      camera.position.y = cameraState.focusPosition[1] + Math.sin(angle) * (orbitRadius * 0.15);
      camera.position.z = cameraState.focusPosition[2] + Math.sin(angle) * orbitRadius * 0.3 + orbitRadius;

      camera.lookAt(cameraState.focusPosition[0], cameraState.focusPosition[1], cameraState.focusPosition[2]);
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePositions();
      updateDynamicCamera();
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function connectWebSocket() {
      ws = new WebSocket('ws://localhost:8080');

      ws.onopen = () => {
        console.log('WebSocket connected');
        sendCommand('init');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'init') {
          words = data.words;
          targetPositions = data.positions;
          currentPositions = data.positions.map(p => [...p]);
          velocities = data.positions.map(() => [0, 0, 0]);
          updatePoints();
        } else if (data.type === 'update') {
          words = data.words;
          targetPositions = data.positions;

          while (currentPositions.length < words.length) {
            currentPositions.push([...targetPositions[currentPositions.length]]);
            velocities.push([0, 0, 0]);
          }

          updatePoints();

          if (data.neighborsForNewWords) {
            showNeighborLabels(data.neighborsForNewWords);
          }
        } else if (data.type === 'notice') {
          console.log(data.message);
        }
      };

      ws.onerror = (error) => console.error('WebSocket error:', error);

      ws.onclose = () => {
        console.log('WebSocket disconnected. Reconnecting...');
        setTimeout(connectWebSocket, 3000);
      };
    }

    function sendCommand(command, data = {}) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ command, ...data }));
      }
    }

    initScene();
    connectWebSocket();
  </script>
</body>
</html>
