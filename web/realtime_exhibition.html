<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Space Evolution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, points;
        let ws = null;
        let words = [];
        let currentPositions = [];
        let targetPositions = [];
        let velocities = [];

        // Initialize Three.js scene
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 8);

            const canvas = document.getElementById('canvas');
            renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            window.addEventListener('resize', onResize);

            animate();
        }

        // Create or update point cloud
        function updatePoints() {
            // Remove old points
            if (points) {
                scene.remove(points);
                points.geometry.dispose();
                points.material.dispose();
            }

            if (words.length === 0) return;

            const geometry = new THREE.BufferGeometry();

            // Create colors
            const colors = [];
            words.forEach(item => {
                const color = new THREE.Color(item.color);
                colors.push(color.r, color.g, color.b);
            });

            // Initialize positions if needed
            while (currentPositions.length < words.length) {
                currentPositions.push([0, 0, 0]);
                velocities.push([0, 0, 0]);
            }

            // Create position buffer
            const positions = new Float32Array(words.length * 3);
            for (let i = 0; i < words.length; i++) {
                positions[i * 3] = currentPositions[i][0];
                positions[i * 3 + 1] = currentPositions[i][1];
                positions[i * 3 + 2] = currentPositions[i][2];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            // Create simple circular dot texture
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 32, 32);  // Clear to transparent
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(16, 16, 15, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.15,  // Small dots
                vertexColors: true,
                transparent: true,
                opacity: 1.0,
                sizeAttenuation: true,
                map: texture,
                alphaTest: 0.5,
                blending: THREE.AdditiveBlending
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);
        }

        // Smooth position updates with linear interpolation
        function updatePositions() {
            if (!points || words.length === 0) return;

            const positions = points.geometry.attributes.position.array;

            // Simple linear interpolation for very smooth movement
            const lerpFactor = 0.12;  // Move 12% toward target each frame for visible continuous motion

            for (let i = 0; i < words.length; i++) {
                for (let j = 0; j < 3; j++) {
                    currentPositions[i][j] += (targetPositions[i][j] - currentPositions[i][j]) * lerpFactor;
                    positions[i * 3 + j] = currentPositions[i][j];
                }
            }

            points.geometry.attributes.position.needsUpdate = true;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            updatePositions();

            // FIXED CAMERA - no orbit movement
            camera.position.set(0, 0, 12);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Handle window resize
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // WebSocket connection
        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:8080/ws');

            ws.onopen = () => {
                console.log('WebSocket connected');
                // Auto-start animation immediately
                sendCommand('start_animation');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'init') {
                    // Initial state
                    words = data.words;
                    targetPositions = data.positions;
                    currentPositions = data.positions.map(p => [...p]);
                    velocities = data.positions.map(() => [0, 0, 0]);
                    updatePoints();
                } else if (data.type === 'update') {
                    // Update state
                    words = data.words;
                    targetPositions = data.positions;

                    // Ensure we have enough current positions and velocities
                    while (currentPositions.length < words.length) {
                        currentPositions.push([...targetPositions[currentPositions.length]]);
                        velocities.push([0, 0, 0]);
                    }

                    updatePoints();
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected. Reconnecting...');
                // Attempt to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Send command to server
        function sendCommand(command, data = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command, ...data }));
            }
        }

        // Initialize
        initScene();
        connectWebSocket();
    </script>
</body>
</html>
