<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Space Evolution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script src="/web/vendor/three.min.js"></script>

    <script>
        let scene, camera, renderer, points;
        let ws = null;
        let words = [];
        let currentPositions = [];
        let targetPositions = [];
        let velocities = [];
        let labelSprites = [];
        let labelTimeout = null;

        // Dynamic viewpoint state
        let cameraState = {
            focusIndex: 0,           // Current dot to focus on
            nextFocusIndex: 0,       // Next dot to transition to
            focusPosition: [0, 0, 0], // Smoothly interpolated focus position
            cameraDistance: 15,      // Larger initial distance to use full landscape
            targetDistance: 15,      // Smooth camera movement
            minDistance: 1,    // never zoom in closer than this
            maxDistance: 5,   // ✅ never zoom out farther than this (prevents tiny clusters)
            lastFocusTime: 0,        // Track when we last changed focus
            focusTransitionDuration: 10000,  // ms between focus changes (10 seconds)
            forcedFocusIndex: null,        // when set, camera pans to this dot
            forcedFocusUntil: 0,           // keep focus until this time
            forcedHoldDuration: 7000,      // ms to hold on new word (tweak)
            snapTransitionDuration: 2500,
            forcedTargetDistance: null,    // when set, overrides density-based zoom during forced focus
            transitionFromPosition: [0, 0, 0] // focusPosition at the moment forced focus began
        };

        // Initialize Three.js scene
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 8);

            const canvas = document.getElementById('canvas');
            renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            // Add coordinate axes
            addAxes();

            window.addEventListener('resize', onResize);

            animate();
        }

        function focusCameraOnIndex(idx) {
            if (!currentPositions[idx]) return;

            const now = Date.now();
            cameraState.forcedFocusIndex = idx;
            cameraState.forcedFocusUntil = now + cameraState.forcedHoldDuration;
            cameraState.lastFocusTime = now;

            // Save wherever the camera is currently looking as the lerp start point
            cameraState.transitionFromPosition = [...cameraState.focusPosition];
        }

        // Add 3D coordinate axes
        function addAxes() {
            const axisLength = 2;
            const axisRadius = 0.013;  // Thickness of the axis cylinders

            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.4
            });

            // X axis - White cylinder
            const xGeometry = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength * 2, 8);
            const xAxis = new THREE.Mesh(xGeometry, material);
            xAxis.rotation.z = Math.PI / 2;  // Rotate to align with X axis
            scene.add(xAxis);

            // Y axis - White cylinder
            const yGeometry = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength * 2, 8);
            const yAxis = new THREE.Mesh(yGeometry, material);
            scene.add(yAxis);

            // Z axis - White cylinder
            const zGeometry = new THREE.CylinderGeometry(axisRadius, axisRadius, axisLength * 2, 8);
            const zAxis = new THREE.Mesh(zGeometry, material);
            zAxis.rotation.x = Math.PI / 2;  // Rotate to align with Z axis
            scene.add(zAxis);
        }

        // Create or update point cloud
        function updatePoints() {
            // If points already exist AND word count is same, just update buffers
            if (points && points.geometry.getAttribute('position')?.count === words.length) {
                updatePointBuffers();
                return;
            }

            // Otherwise rebuild (word count changed)
            if (points) {
                scene.remove(points);
                points.geometry.dispose();
                points.material.dispose();
            }
            if (words.length === 0) return;

            const geometry = new THREE.BufferGeometry();

            // Create colors
            const colors = [];
            words.forEach(item => {
                const color = new THREE.Color(item.color);
                colors.push(color.r, color.g, color.b);
            });

            // Initialize positions if needed
            while (currentPositions.length < words.length) {
                currentPositions.push([0, 0, 0]);
                velocities.push([0, 0, 0]);
            }

            // Create position buffer
            const positions = new Float32Array(words.length * 3);
            for (let i = 0; i < words.length; i++) {
                positions[i * 3] = currentPositions[i][0];
                positions[i * 3 + 1] = currentPositions[i][1];
                positions[i * 3 + 2] = currentPositions[i][2];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            // Create simple circular dot texture
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 32, 32);  // Clear to transparent
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(16, 16, 15, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.1,  // Smaller dots
                vertexColors: true,
                transparent: true,
                opacity: 0.55,
                sizeAttenuation: true,
                map: texture,
                alphaTest: 0.5,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);
        }

        // Smooth position updates with linear interpolation
        function updatePositions() {
            if (!points || words.length === 0) return;

            const positions = points.geometry.attributes.position.array;

            // Simple linear interpolation for very smooth movement
            const lerpFactor = 0.12;  // Move 12% toward target each frame for visible continuous motion

            for (let i = 0; i < words.length; i++) {
                for (let j = 0; j < 3; j++) {
                    currentPositions[i][j] += (targetPositions[i][j] - currentPositions[i][j]) * lerpFactor;
                    positions[i * 3 + j] = currentPositions[i][j];
                }
            }

            points.geometry.attributes.position.needsUpdate = true;
        }

        // Calculate neighborhood density around a point
        function calculateDensity(pointIndex, radius = 2.0) {
            if (currentPositions.length === 0) return 0;
            const point = currentPositions[pointIndex];
            let neighborCount = 0;

            for (let i = 0; i < currentPositions.length; i++) {
                if (i === pointIndex) continue;
                const neighbor = currentPositions[i];
                const dx = neighbor[0] - point[0];
                const dy = neighbor[1] - point[1];
                const dz = neighbor[2] - point[2];
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

                if (distance < radius) {
                    neighborCount++;
                }
            }
            return neighborCount;
        }

        // Find the densest cluster region
        function findDensestPoint() {
            if (currentPositions.length === 0) return 0;
            let maxDensity = 0;
            let densestIndex = 0;

            for (let i = 0; i < currentPositions.length; i++) {
                const density = calculateDensity(i);
                if (density > maxDensity) {
                    maxDensity = density;
                    densestIndex = i;
                }
            }
            return densestIndex;
        }

        // Find adjacent cluster in the neighborhood
        function findAdjacentCluster(currentIndex, radius = 3.0) {
            const point = currentPositions[currentIndex];
            let bestIndex = currentIndex;
            let bestScore = -1;

            // Look for a neighbor that has good density and is different from current
            for (let i = 0; i < currentPositions.length; i++) {
                if (i === currentIndex) continue;
                const neighbor = currentPositions[i];
                const dx = neighbor[0] - point[0];
                const dy = neighbor[1] - point[1];
                const dz = neighbor[2] - point[2];
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

                if (distance < radius) {
                    const density = calculateDensity(i);
                    // Prefer neighbors with good density and moderate distance
                    const score = density - (distance * 0.5);
                    if (score > bestScore) {
                        bestScore = score;
                        bestIndex = i;
                    }
                }
            }
            return bestIndex;
        }

        function updatePointBuffers() {
            if (!points) return;

            // Update positions buffer (keep same typed array)
            const posAttr = points.geometry.getAttribute('position');
            const positions = posAttr.array;

            for (let i = 0; i < words.length; i++) {
                positions[i * 3] = currentPositions[i][0];
                positions[i * 3 + 1] = currentPositions[i][1];
                positions[i * 3 + 2] = currentPositions[i][2];
            }
            posAttr.needsUpdate = true;

            // Update colors buffer if needed
            const colAttr = points.geometry.getAttribute('color');
            const colors = colAttr.array;

            for (let i = 0; i < words.length; i++) {
                const c = new THREE.Color(words[i].color);
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }
            colAttr.needsUpdate = true;
        }

        function clearLabels() {
            labelSprites.forEach(s => {
                scene.remove(s);
                if (s.material && s.material.map) s.material.map.dispose();
                if (s.material) s.material.dispose();
            });
            labelSprites = [];
        }

        function makeTextSprite(text, color = "#ffffff") {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            const fontSize = 36;
            ctx.font = `${fontSize}px "Consolas", monospace`;
            const padding = 16;
            const textWidth = Math.ceil(ctx.measureText(text).width);

            canvas.width = textWidth + padding * 2;
            canvas.height = fontSize + padding * 2;

            const ctx2 = canvas.getContext("2d");
            ctx2.font = `${fontSize}px "Consolas", monospace`;
            ctx2.fillStyle = "rgba(0,0,0,0.65)";
            ctx2.fillRect(0, 0, canvas.width, canvas.height);
            ctx2.fillStyle = color;
            ctx2.fillText(text, padding, fontSize + Math.floor(padding * 0.6));

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;

            // ✅ critical: render on top of your additive points
            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false,
                depthWrite: false
            });

            const sprite = new THREE.Sprite(material);
            sprite.renderOrder = 999;
            const aspect = canvas.width / canvas.height;
            const height = 0.5;
            sprite.scale.set(height * aspect, height, 1);

            return sprite;
        }

        function resolveLabelOverlapsScreenSpace(iterations = 2) {
            if (labelSprites.length < 2) return;

            // Project all sprites to screen space
            const proj = labelSprites.map(s => {
                const v = s.position.clone().project(camera);
                const sx = (v.x + 1) / 2 * window.innerWidth;
                const sy = (-v.y + 1) / 2 * window.innerHeight;
                const dist = Math.max(0.01, camera.position.distanceTo(s.position));
                const fovPx = window.innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
                const sw = (s.scale.x / dist) * fovPx;
                const sh = (s.scale.y / dist) * fovPx;
                return { sx, sy, sw, sh };
            });

            for (let it = 0; it < iterations; it++) {
                for (let a = 0; a < labelSprites.length; a++) {
                    for (let b = a + 1; b < labelSprites.length; b++) {
                        const A = proj[a], B = proj[b];
                        const wordA = words[labelSprites[a].userData?.pointIndex]?.word;
                        const wordB = words[labelSprites[b].userData?.pointIndex]?.word;
                        if (wordA && wordB && wordA.toLowerCase() === wordB.toLowerCase()) continue;

                        const overlapX = (A.sw + B.sw) / 2 - Math.abs(B.sx - A.sx);
                        const overlapY = (A.sh + B.sh) / 2 - Math.abs(B.sy - A.sy);
                        const minH = Math.min(A.sh, B.sh);

                        // Only push if overlap exceeds 60% of the smaller label's height
                        if (overlapX > 0 && overlapY > minH * 0.6) {
                            const push = overlapY * 0.3;
                            if (B.sy >= A.sy) { A.sy -= push; B.sy += push; }
                            else               { A.sy += push; B.sy -= push; }
                        }
                    }
                }
            }

            // Unproject adjusted screen positions back to world space (keep original depth)
            for (let i = 0; i < labelSprites.length; i++) {
                const s = labelSprites[i];
                const p = proj[i];
                const ndcX = (p.sx / window.innerWidth) * 2 - 1;
                const ndcY = -(p.sy / window.innerHeight) * 2 + 1;
                const ndcZ = s.position.clone().project(camera).z;
                s.position.copy(new THREE.Vector3(ndcX, ndcY, ndcZ).unproject(camera));
            }
        }

        function updateLabelAnchors() {
            // Reset each label to its anchor point first
            for (const s of labelSprites) {
                const idx = s.userData?.pointIndex;
                if (idx == null || !currentPositions[idx]) continue;
                s.position.set(
                    currentPositions[idx][0],
                    currentPositions[idx][1] + (s.userData?.yOffset ?? 0.25),
                    currentPositions[idx][2]
                );
            }
            // Then resolve overlaps in screen space every frame
            resolveLabelOverlapsScreenSpace();
        }


        function showNeighborLabels(neighborsForNewWords) {
            clearLabels();

            console.log('showNeighborLabels called with:', neighborsForNewWords);

            // Compute zoom distance to fit neighbors in view
            let maxNeighborDist = 0;
            neighborsForNewWords.forEach(entry => {
                const newIdx = entry.newWordIndex;
                if (!currentPositions[newIdx]) return;
                const origin = currentPositions[newIdx];
                (entry.neighbors || []).slice(0, 7).forEach(idx => {
                    if (!currentPositions[idx]) return;
                    const n = currentPositions[idx];
                    const dx = n[0] - origin[0];
                    const dy = n[1] - origin[1];
                    const dz = n[2] - origin[2];
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    if (dist > maxNeighborDist) maxNeighborDist = dist;
                });
            });
            if (maxNeighborDist > 0) {
                // 2.5x the spread so labels aren't at the edge; clamp to avoid zooming too far out
                const desired = maxNeighborDist * 2.5;
                cameraState.forcedTargetDistance = Math.min(
                    Math.max(desired, cameraState.minDistance),
                    cameraState.maxDistance
                );
            }

            neighborsForNewWords.forEach(entry => {
                const newIdx = entry.newWordIndex;
                const neighborIdxs = (entry.neighbors || []).slice(0, 7);
                console.log(`New word index: ${newIdx}, word: ${words[newIdx]?.word}, neighbors:`, neighborIdxs);

                // Track which word strings we've already labeled (case-insensitive)
                const seen = new Set();

                function addLabel(idx, color, yOffset = 0.25) {
                if (!currentPositions[idx]) return;

                const w = (words[idx]?.word || "").trim();
                if (!w) return;

                const key = w.toLowerCase();
                if (seen.has(key)) return;   // ✅ skip duplicates
                seen.add(key);

                const sprite = makeTextSprite(w, color);

                // ✅ store anchor so it can follow the dot as it moves
                sprite.userData.pointIndex = idx;
                sprite.userData.yOffset = yOffset;

                sprite.position.set(
                    currentPositions[idx][0],
                    currentPositions[idx][1] + yOffset,
                    currentPositions[idx][2]
                );

                scene.add(sprite);
                labelSprites.push(sprite);
                }

                // New word label first (orange)
                addLabel(newIdx, "#ff9800", 0.35);

                // Neighbor labels (white), deduped
                neighborIdxs.forEach(i => addLabel(i, "#ffffff", 0.25));
            });

            if (labelTimeout) clearTimeout(labelTimeout);
            labelTimeout = setTimeout(() => clearLabels(), 10000);
        }

        function updateDynamicCamera() {
            if (currentPositions.length === 0) return;

            const now = Date.now();

            // ✅ If we have a forced focus (new word), lock onto it
            const forcing = (cameraState.forcedFocusIndex !== null && now < cameraState.forcedFocusUntil);

            if (forcing) {
                // Lerp from where the camera was looking when forced focus began → new word position
                const targetPoint = currentPositions[cameraState.forcedFocusIndex];
                const elapsed = now - cameraState.lastFocusTime;
                const snapProgress = Math.min(elapsed / cameraState.snapTransitionDuration, 1.0);
                const easeProgress = 1 - Math.pow(1 - snapProgress, 3);

                for (let i = 0; i < 3; i++) {
                    cameraState.focusPosition[i] = cameraState.transitionFromPosition[i] +
                        (targetPoint[i] - cameraState.transitionFromPosition[i]) * easeProgress;
                }

                cameraState.focusIndex = cameraState.forcedFocusIndex;
                cameraState.nextFocusIndex = cameraState.forcedFocusIndex;
            } else {
                // Normal roaming: lerp between adjacent cluster points
                if (now - cameraState.lastFocusTime > cameraState.focusTransitionDuration) {
                    cameraState.focusIndex = cameraState.nextFocusIndex;
                    cameraState.nextFocusIndex = findAdjacentCluster(cameraState.focusIndex);
                    cameraState.lastFocusTime = now;
                }

                const currentFocusPoint = currentPositions[cameraState.focusIndex];
                const nextFocusPoint = currentPositions[cameraState.nextFocusIndex];
                const timeSinceFocus = now - cameraState.lastFocusTime;
                const transitionProgress = Math.min(timeSinceFocus / cameraState.focusTransitionDuration, 1.0);
                const easeProgress = 1 - Math.pow(1 - transitionProgress, 3);

                for (let i = 0; i < 3; i++) {
                    cameraState.focusPosition[i] =
                        currentFocusPoint[i] + (nextFocusPoint[i] - currentFocusPoint[i]) * easeProgress;
                }
            }

            if (forcing && cameraState.forcedTargetDistance !== null) {
                // Zoom to show the new word's neighbors
                cameraState.targetDistance = cameraState.forcedTargetDistance;
            } else {
                const density = calculateDensity(cameraState.focusIndex, 2.5);
                const maxDensity = currentPositions.length * 0.3;

                cameraState.targetDistance = 20 - (Math.min(density, maxDensity) / maxDensity) * 14;
            }

            // ✅ clamp zoom
            cameraState.targetDistance = Math.max(cameraState.minDistance,
                                    Math.min(cameraState.maxDistance, cameraState.targetDistance));

            cameraState.cameraDistance += (cameraState.targetDistance - cameraState.cameraDistance) * 0.02;

            // ✅ also clamp the smoothed value (so it can't drift past bounds)
            cameraState.cameraDistance = Math.max(cameraState.minDistance,
                                    Math.min(cameraState.maxDistance, cameraState.cameraDistance));


            const orbitRadius = cameraState.cameraDistance;
            const t = now / 1000;
            const angle = (t * 0.02) % (Math.PI * 2);

            camera.position.x = cameraState.focusPosition[0] + Math.cos(angle) * orbitRadius * 0.6;
            camera.position.y = cameraState.focusPosition[1] + Math.sin(angle) * (orbitRadius * 0.15);
            camera.position.z = cameraState.focusPosition[2] + Math.sin(angle) * orbitRadius * 0.3 + orbitRadius;

            camera.lookAt(cameraState.focusPosition[0], cameraState.focusPosition[1], cameraState.focusPosition[2]);

            // ✅ clear forced focus once time is up
            if (cameraState.forcedFocusIndex !== null && now >= cameraState.forcedFocusUntil) {
                cameraState.forcedFocusIndex = null;
                cameraState.forcedTargetDistance = null;
            }
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            updatePositions();
            updateLabelAnchors();  // Update label positions to follow dots
            updateDynamicCamera();

            renderer.render(scene, camera);
        }

        // Handle window resize
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // WebSocket connection
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                console.log('WebSocket connected');
                // Auto-start animation immediately
                sendCommand('start_animation');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'init') {
                    // Initial state
                    words = data.words;
                    targetPositions = data.positions;
                    currentPositions = data.positions.map(p => [...p]);
                    velocities = data.positions.map(() => [0, 0, 0]);
                    updatePoints();
                } else if (data.type === 'update') {
                    const prevCount = words.length;
                    const prevLen = words.length;

                    words = data.words;
                    targetPositions = data.positions;

                    while (currentPositions.length < words.length) {
                        currentPositions.push([...targetPositions[currentPositions.length]]);
                        velocities.push([0, 0, 0]);
                    }

                    if (data.words.length > prevCount) {
                        const newIdx = data.words.length - 1;
                        focusCameraOnIndex(newIdx);
                    }

                    // Only rebuild if new words were added (length change)
                    if (!points || words.length !== prevLen) {
                        updatePoints();
                    } else {
                        // Otherwise just update colors buffer (cheap)
                        updatePointBuffers();
                    }

                    if (data.neighborsForNewWords) {
                        showNeighborLabels(data.neighborsForNewWords);
                    }
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected. Reconnecting...');
                // Attempt to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Send command to server
        function sendCommand(command, data = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command, ...data }));
            }
        }

        // Initialize
        initScene();
        connectWebSocket();
    </script>
</body>
</html>
