<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Space Evolution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, points;
        let ws = null;
        let words = [];
        let currentPositions = [];
        let targetPositions = [];
        let velocities = [];

        // Dynamic viewpoint state
        let cameraState = {
            focusIndex: 0,           // Current dot to focus on
            nextFocusIndex: 0,       // Next dot to transition to
            focusPosition: [0, 0, 0], // Smoothly interpolated focus position
            cameraDistance: 15,      // Larger initial distance to use full landscape
            targetDistance: 15,      // Smooth camera movement
            lastFocusTime: 0,        // Track when we last changed focus
            focusTransitionDuration: 10000  // ms between focus changes (10 seconds)
        };

        // Initialize Three.js scene
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 8);

            const canvas = document.getElementById('canvas');
            renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            window.addEventListener('resize', onResize);

            animate();
        }

        // Create or update point cloud
        function updatePoints() {
            // Remove old points
            if (points) {
                scene.remove(points);
                points.geometry.dispose();
                points.material.dispose();
            }

            if (words.length === 0) return;

            const geometry = new THREE.BufferGeometry();

            // Create colors
            const colors = [];
            words.forEach(item => {
                const color = new THREE.Color(item.color);
                colors.push(color.r, color.g, color.b);
            });

            // Initialize positions if needed
            while (currentPositions.length < words.length) {
                currentPositions.push([0, 0, 0]);
                velocities.push([0, 0, 0]);
            }

            // Create position buffer
            const positions = new Float32Array(words.length * 3);
            for (let i = 0; i < words.length; i++) {
                positions[i * 3] = currentPositions[i][0];
                positions[i * 3 + 1] = currentPositions[i][1];
                positions[i * 3 + 2] = currentPositions[i][2];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            // Create simple circular dot texture
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 32, 32);  // Clear to transparent
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(16, 16, 15, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.1,  // Smaller dots
                vertexColors: true,
                transparent: true,
                opacity: 1.0,
                sizeAttenuation: true,
                map: texture,
                alphaTest: 0.5,
                blending: THREE.AdditiveBlending
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);
        }

        // Smooth position updates with linear interpolation
        function updatePositions() {
            if (!points || words.length === 0) return;

            const positions = points.geometry.attributes.position.array;

            // Simple linear interpolation for very smooth movement
            const lerpFactor = 0.12;  // Move 12% toward target each frame for visible continuous motion

            for (let i = 0; i < words.length; i++) {
                for (let j = 0; j < 3; j++) {
                    currentPositions[i][j] += (targetPositions[i][j] - currentPositions[i][j]) * lerpFactor;
                    positions[i * 3 + j] = currentPositions[i][j];
                }
            }

            points.geometry.attributes.position.needsUpdate = true;
        }

        // Calculate neighborhood density around a point
        function calculateDensity(pointIndex, radius = 2.0) {
            if (currentPositions.length === 0) return 0;
            const point = currentPositions[pointIndex];
            let neighborCount = 0;

            for (let i = 0; i < currentPositions.length; i++) {
                if (i === pointIndex) continue;
                const neighbor = currentPositions[i];
                const dx = neighbor[0] - point[0];
                const dy = neighbor[1] - point[1];
                const dz = neighbor[2] - point[2];
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

                if (distance < radius) {
                    neighborCount++;
                }
            }
            return neighborCount;
        }

        // Find the densest cluster region
        function findDensestPoint() {
            if (currentPositions.length === 0) return 0;
            let maxDensity = 0;
            let densestIndex = 0;

            for (let i = 0; i < currentPositions.length; i++) {
                const density = calculateDensity(i);
                if (density > maxDensity) {
                    maxDensity = density;
                    densestIndex = i;
                }
            }
            return densestIndex;
        }

        // Find adjacent cluster in the neighborhood
        function findAdjacentCluster(currentIndex, radius = 3.0) {
            const point = currentPositions[currentIndex];
            let bestIndex = currentIndex;
            let bestScore = -1;

            // Look for a neighbor that has good density and is different from current
            for (let i = 0; i < currentPositions.length; i++) {
                if (i === currentIndex) continue;
                const neighbor = currentPositions[i];
                const dx = neighbor[0] - point[0];
                const dy = neighbor[1] - point[1];
                const dz = neighbor[2] - point[2];
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

                if (distance < radius) {
                    const density = calculateDensity(i);
                    // Prefer neighbors with good density and moderate distance
                    const score = density - (distance * 0.5);
                    if (score > bestScore) {
                        bestScore = score;
                        bestIndex = i;
                    }
                }
            }
            return bestIndex;
        }

        // Update camera to focus on dynamic viewpoint
        function updateDynamicCamera() {
            if (currentPositions.length === 0) return;

            // Periodically find new focus point
            const now = Date.now();
            if (now - cameraState.lastFocusTime > cameraState.focusTransitionDuration) {
                cameraState.focusIndex = cameraState.nextFocusIndex;
                cameraState.nextFocusIndex = findAdjacentCluster(cameraState.focusIndex);
                cameraState.lastFocusTime = now;
            }

            const currentFocusPoint = currentPositions[cameraState.focusIndex];
            const nextFocusPoint = currentPositions[cameraState.nextFocusIndex];

            // Smoothly interpolate focus position between current and next focus
            // Transition over the entire duration for smooth movement
            const timeSinceFocus = now - cameraState.lastFocusTime;
            const transitionProgress = Math.min(timeSinceFocus / cameraState.focusTransitionDuration, 1.0);

            // Ease-out cubic for smooth deceleration
            const easeProgress = 1 - Math.pow(1 - transitionProgress, 3);

            for (let i = 0; i < 3; i++) {
                cameraState.focusPosition[i] =
                    currentFocusPoint[i] + (nextFocusPoint[i] - currentFocusPoint[i]) * easeProgress;
            }

            // Calculate density at current focus to determine zoom
            const density = calculateDensity(cameraState.focusIndex, 2.5);
            const maxDensity = currentPositions.length * 0.3;

            // Higher density = closer zoom (smaller distance)
            // Distance ranges from 6 (very dense) to 20 (sparse) for landscape viewing
            cameraState.targetDistance = 20 - (Math.min(density, maxDensity) / maxDensity) * 14;

            // Smoothly interpolate camera distance
            cameraState.cameraDistance += (cameraState.targetDistance - cameraState.cameraDistance) * 0.02;

            // Create very subtle camera orbit around focus point
            const orbitRadius = cameraState.cameraDistance;
            const time = now / 1000;
            const angle = (time * 0.02) % (Math.PI * 2); // Extremely slow rotation (0.02 rad/s)

            // Position camera in subtle orbit around smoothly interpolated focus point
            camera.position.x = cameraState.focusPosition[0] + Math.cos(angle) * orbitRadius * 0.3;
            camera.position.y = cameraState.focusPosition[1] + Math.sin(angle) * (orbitRadius * 0.15);
            camera.position.z = cameraState.focusPosition[2] + Math.sin(angle) * orbitRadius * 0.3 + orbitRadius;

            // Always look at the smoothly interpolated focus point
            camera.lookAt(cameraState.focusPosition[0], cameraState.focusPosition[1], cameraState.focusPosition[2]);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            updatePositions();
            updateDynamicCamera();

            renderer.render(scene, camera);
        }

        // Handle window resize
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // WebSocket connection
        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:8080/ws');

            ws.onopen = () => {
                console.log('WebSocket connected');
                // Auto-start animation immediately
                sendCommand('start_animation');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'init') {
                    // Initial state
                    words = data.words;
                    targetPositions = data.positions;
                    currentPositions = data.positions.map(p => [...p]);
                    velocities = data.positions.map(() => [0, 0, 0]);
                    updatePoints();
                } else if (data.type === 'update') {
                    // Update state
                    words = data.words;
                    targetPositions = data.positions;

                    // Ensure we have enough current positions and velocities
                    while (currentPositions.length < words.length) {
                        currentPositions.push([...targetPositions[currentPositions.length]]);
                        velocities.push([0, 0, 0]);
                    }

                    updatePoints();
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected. Reconnecting...');
                // Attempt to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Send command to server
        function sendCommand(command, data = {}) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command, ...data }));
            }
        }

        // Initialize
        initScene();
        connectWebSocket();
    </script>
</body>
</html>
